[workspace]
resolver = "2"
members = ["core", "exchanges", "strategies", "app", "examples", "web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }

quantkit-core = { path = "core" }
quantkit-exchanges = { path = "exchanges" }
quantkit-strategies = { path = "strategies" }
