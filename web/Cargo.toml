[package]
name = "quantkit-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "quantkit WebUI: 通用加密货币量化交易平台（axum REST + 内嵌前端）"

[[bin]]
name = "quantkit-web"
path = "src/main.rs"

[dependencies]
quantkit-core = { workspace = true }
quantkit-app = { path = "../app" }
quantkit-exchanges = { workspace = true }
axum = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
